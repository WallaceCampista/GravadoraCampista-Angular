<div class="centered-div">
  <div>
    <div class="accordion limited-width-accordion">
      <div *ngFor="let album of albuns" class="accordion-item">
        <h2 class="accordion-header">
          <button class="accordion-button" [class.collapsed]="albumAberto !== album.albumId" type="button" [attr.aria-expanded]="albumAberto === album.albumId" [attr.aria-controls]="'collapse' + album.albumId" (click)="alternarAlbum(album.albumId)">
            <app-capa class="capa-mini" [arquivo]="album.capaArquivo" [nome]="album.nomeAlbum"></app-capa>
            <strong>{{ album.nomeAlbum }}</strong>
          </button>
        </h2>
        <!-- Abre e fecha pelo Angular: a altura acompanha a tabela mesmo quando as músicas chegam depois -->
        <div [id]="'collapse' + album.albumId" class="painel-album" [class.aberto]="albumAberto === album.albumId">
          <div class="painel-conteudo">
            <div class="accordion-body">
              <p *ngIf="!musicasPorAlbum[album.albumId]" class="mb-0 center-text">Carregando...</p>
              <p *ngIf="musicasPorAlbum[album.albumId]?.length === 0" class="mb-0 center-text">Nenhuma música cadastrada.</p>
              <button type="button" class="btn btn-sm btn-success mb-2" *ngIf="faixasDoAlbum(album).length" (click)="tocarAlbum(album)">
                <i class="fa-solid fa-play"></i> Tocar álbum
              </button>
              <table class="table center-text" *ngIf="musicasPorAlbum[album.albumId]?.length">
                <thead>
                  <tr>
                    <th scope="col"><span class="visually-hidden">Tocar</span></th>
                    <th scope="col">Faixa</th>
                    <th scope="col">Nome</th>
                    <th scope="col">Duração</th>
                    <th scope="col">Avaliação</th>
                  </tr>
                </thead>
                <tbody class="table-group-divider">
                  <tr *ngFor="let musica of musicasPorAlbum[album.albumId]; let i = index" [class.tocando]="ehAtual(musica)">
                    <td>
                      <button *ngIf="musica.audioArquivo" type="button" class="botao-tocar" [class.atual]="ehAtual(musica)" (click)="tocarFaixa(album, musica)"
                              [title]="tocandoAgora(musica) ? 'Pausar' : 'Tocar'" [attr.aria-label]="(tocandoAgora(musica) ? 'Pausar ' : 'Tocar ') + musica.nomeMusica">
                        <i class="fa-solid" [class.fa-pause]="tocandoAgora(musica)" [class.fa-play]="!tocandoAgora(musica)"></i>
                      </button>
                    </td>
                    <td>{{ i + 1 }}</td>
                    <td>{{ musica.nomeMusica }}</td>
                    <td>{{ musica.duracao | duracao }}</td>
                    <td>{{ musica.avaliacaoMedia | number:'1.1-1' }} <app-star></app-star></td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

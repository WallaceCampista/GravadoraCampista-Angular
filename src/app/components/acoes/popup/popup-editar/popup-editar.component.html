<div class="modal" [ngClass]="{'show': showModal}" tabindex="-1" *ngIf="showModal">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Editar {{ titulo }}</h5>
        <button type="button" class="btn-close" (click)="fechar()" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <p>Quais campos deseja editar ? </p>
        <form [formGroup]="editForm" [ngSwitch]="tipo">
        <div class="form-group">
          <div class="row" *ngSwitchCase="'usuario'">
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="username" id="usernameUsuario" placeholder="Username" type="text"/>
                <label for="usernameUsuario" class="label-large">Username: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="password" id="passwordUsuario" placeholder="Nova senha" type="password"/>
                <label for="passwordUsuario" class="label-large">Nova senha (opcional): </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="email" id="emailUsuario" placeholder="Email" type="email"/>
                <label for="emailUsuario" class="label-large">Email: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="primeiroNome" id="nomeUsuario" placeholder="Nome" type="text"/>
                <label for="nomeUsuario" class="label-large">Nome: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="sobrenome" id="sobrenomeUsuario" placeholder="Sobrenome" type="text"/>
                <label for="sobrenomeUsuario" class="label-large">Sobrenome: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <select class="form-control" formControlName="isAdmin" id="isAdminUsuario">
                  <option [ngValue]="true">Sim</option>
                  <option [ngValue]="false">Não</option>
                </select>
                <label for="isAdminUsuario" class="label-large">Administrador: </label>
              </div>
            </div>
          </div>
          <div class="row" *ngSwitchCase="'banda'">
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="nomeBanda" id="nomeBanda" placeholder="Nome da Banda" type="text"/>
                <label for="nomeBanda" class="label-large">Nome da Banda: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="resumoBanda" id="resumoBanda" placeholder="Resumo da Banda" type="text"/>
                <label for="resumoBanda" class="label-large">Resumo da Banda: </label>
              </div>
            </div>
          </div>
          <div class="row" *ngSwitchCase="'album'">
            <div class="col-md-4">
              <div class="form-floating mb-3">
                <select class="form-select" formControlName="idBanda" id="idBanda">
                  <option [ngValue]="null" disabled>Selecione</option>
                  <option *ngFor="let item of bandas" [ngValue]="item.idBanda">{{ item.nomeBanda }}</option>
                </select>
                <label for="idBanda" class="label-large">Banda: </label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="nomeAlbum" id="nomeAlbum" placeholder="Nome do Album" type="text"/>
                <label for="nomeAlbum" class="label-large">Nome do Album: </label>
              </div>
            </div>
            <div class="col-md-4">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="resumoAlbum" id="resumoAlbum" placeholder="Resumo do Album" type="text"/>
                <label for="resumoAlbum" class="label-large">Resumo do Album: </label>
              </div>
            </div>
          </div>
          <div class="row" *ngSwitchCase="'musica'">
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <select class="form-select" formControlName="idAlbum" id="idAlbum">
                  <option [ngValue]="null" disabled>Selecione</option>
                  <option *ngFor="let item of albuns" [ngValue]="item.idAlbum">{{ item.nomeAlbum }} — {{ item.banda.nomeBanda }}</option>
                </select>
                <label for="idAlbum" class="label-large">Álbum: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="nomeMusica" id="nomeMusica" placeholder="Nome da Música" type="text"/>
                <label for="nomeMusica" class="label-large">Nome da Música: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="resumoMusica" id="resumoMusica" placeholder="Resumo da Música" type="text"/>
                <label for="resumoMusica" class="label-large">Resumo da Música: </label>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-floating mb-3">
                <input class="form-control" formControlName="duracaoMusica" id="duracaoMusica" placeholder="Duração da Música (Seg)" type="text" [readonly]="!!audioMusica"/>
                <label for="duracaoMusica" class="label-large">{{ audioMusica ? 'Duração (lida do MP3, seg):' : 'Duração da Música (Seg):' }} </label>
              </div>
            </div>
          </div>
        </div>
        </form>
        <app-editar-imagem *ngIf="tipoImagem as tipoImg" [tipo]="tipoImg" [id]="item.id" [arquivo]="tipoImg === 'banda' ? item.foto : item.capa" [nome]="item.nome" (alterada)="alterado = true"></app-editar-imagem>
        <app-editar-audio *ngIf="tipo === 'musica'" [id]="item.id" [arquivo]="audioMusica" [duracao]="item.duracao" (alterado)="audioAlterado($event)"></app-editar-audio>
        <app-error *ngIf="errorMessage" [message]="errorMessage"></app-error>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="fechar()">Fechar</button>
        <button type="button" class="btn btn-success" (click)="saveChanges()" [disabled]="isSaving">Salvar</button>
      </div>
    </div>
  </div>
</div>

<div class="horizontal-spacing">
  <div class="align-self-center"></div>
  <form [formGroup]="form">
    <div class="form-row">
      <div class="form-floating mx-auto">
        <select class="form-select" formControlName="idAlbum" id="idAlbum">
          <option [ngValue]="null" disabled>Selecione</option>
          <option *ngFor="let item of albuns" [ngValue]="item.idAlbum">{{ item.nomeAlbum }} — {{ item.banda.nomeBanda }}</option>
        </select>
        <label for="idAlbum">Álbum: </label>
      </div>
      <div class="form-floating mx-auto">
        <input
          class="form-control"
          formControlName="nomeMusica"
          id="nMusica"
          placeholder="Nome da Musica:"
          type="text"
        />
        <label for="nMusica">Nome da Música: </label>
      </div>
      <div class="form-floating mx-auto">
        <input
          class="form-control"
          formControlName="resumoMusica"
          id="rMusica"
          placeholder="Resumo da Música:"
          type="text"
        />
        <label for="rMusica">Resumo da Música: </label>
      </div>
      <div class="form-floating mx-auto">
        <input
          class="form-control"
          formControlName="duracao"
          id="dMusica"
          placeholder="Duração da Música:"
          type="text"
        />
        <label for="dMusica">Duração (Seg, opcional): </label>
      </div>
    </div>
  </form>
  <button type="button" class="btn btn-success" (click)="onRegister()" [disabled]="isLoading" [ngClass]="{'btn-enlarged': isLoading, 'btn-loading': isLoading}">
    <ng-container *ngIf="!isLoading; else loading">
      Cadastrar
    </ng-container>
    <ng-template #loading>
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </ng-template>
  </button>
</div>

<app-sucesso *ngIf="showSuccessAlert" [message]="alertMessage" class="alert-top-right"></app-sucesso>
<app-error *ngIf="showErrorAlert" [message]="alertMessage" class="alert-top-right"></app-error>
